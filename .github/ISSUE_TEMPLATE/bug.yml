name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, tokens, or private filesystem paths."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include minimal reproduction steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
